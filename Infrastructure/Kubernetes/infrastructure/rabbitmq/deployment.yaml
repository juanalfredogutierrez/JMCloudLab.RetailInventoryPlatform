apiVersion: apps/v1
kind: Deployment

metadata:
  name: rabbitmq
  namespace: retailinventory

  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/instance: retailinventory
    app.kubernetes.io/version: "3.13"
    app.kubernetes.io/part-of: retailinventory-platform
    app.kubernetes.io/managed-by: kubectl

spec:

  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq

  template:

    metadata:

      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: messaging
        app.kubernetes.io/instance: retailinventory
        app.kubernetes.io/version: "3.13"
        app.kubernetes.io/part-of: retailinventory-platform

    spec:

      containers:

        - name: rabbitmq

          image: rabbitmq:3.13-management

          imagePullPolicy: IfNotPresent

          resources:

           requests:
             cpu: "250m"
             memory: "512Mi"
        
           limits:
             cpu: "1"
             memory: "1Gi"
            
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
            
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_running

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3  
            
          livenessProbe:
            exec:
                command:
                - rabbitmq-diagnostics
                - check_running
            
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
             
          ports:

            - containerPort: 5672
              name: amqp

            - containerPort: 15672
              name: management

          env:

            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER

            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS

          volumeMounts:

            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq

      volumes:

        - name: rabbitmq-storage

          persistentVolumeClaim:
            claimName: rabbitmq-pvc