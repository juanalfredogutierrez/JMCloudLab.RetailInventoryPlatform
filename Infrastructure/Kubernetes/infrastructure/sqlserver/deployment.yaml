apiVersion: apps/v1
kind: Deployment

metadata:
  name: sqlserver
  namespace: retailinventory

  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: retailinventory
    app.kubernetes.io/version: "2022"
    app.kubernetes.io/part-of: retailinventory-platform
    app.kubernetes.io/managed-by: kubectl

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sqlserver

  template:

    metadata:

      labels:
        app.kubernetes.io/name: sqlserver
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: retailinventory
        app.kubernetes.io/version: "2022"
        app.kubernetes.io/part-of: retailinventory-platform

    spec:

      containers:

        - name: sqlserver

          image: mcr.microsoft.com/mssql/server:2022-latest

          imagePullPolicy: IfNotPresent
          
          resources:

           requests:
             cpu: "500m"
             memory: "2Gi"
        
           limits:
             cpu: "2"
             memory: "4Gi"

          ports:
            - containerPort: 1433
              name: tds

          env:

            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_PID
              value: "Developer"

            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: SA_PASSWORD

          envFrom:

            - configMapRef:
                name: platform-config

          volumeMounts:

            - name: sqlserver-storage
              mountPath: /var/opt/mssql

      volumes:

        - name: sqlserver-storage
          persistentVolumeClaim:
            claimName: sqlserver-pvc