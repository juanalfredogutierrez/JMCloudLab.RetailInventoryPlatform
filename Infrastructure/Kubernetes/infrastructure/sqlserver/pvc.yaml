apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: sqlserver-pvc
  namespace: retailinventory

  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: retailinventory
    app.kubernetes.io/version: "2022"
    app.kubernetes.io/part-of: retailinventory-platform
    app.kubernetes.io/managed-by: kubectl

spec:

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi