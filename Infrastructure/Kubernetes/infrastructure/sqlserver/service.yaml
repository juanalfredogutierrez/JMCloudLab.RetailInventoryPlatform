apiVersion: v1
kind: Service

metadata:
  name: sqlserver
  namespace: retailinventory

  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: retailinventory
    app.kubernetes.io/version: "2022"
    app.kubernetes.io/part-of: retailinventory-platform
    app.kubernetes.io/managed-by: kubectl

spec:

  type: ClusterIP

  selector:
    app.kubernetes.io/name: sqlserver

  ports:

    - name: tds
      port: 1433
      targetPort: 1433
      protocol: TCP