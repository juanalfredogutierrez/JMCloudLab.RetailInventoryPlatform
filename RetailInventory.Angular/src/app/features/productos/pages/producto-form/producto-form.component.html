<div class="form-card">

  <div class="form-header">

    <h1>Nuevo producto</h1>

    <p>
      Registra un nuevo producto para que pueda ser utilizado
      en compras y ventas.
    </p>

  </div>

  <form [formGroup]="form">

    <div class="form-grid">

      <div class="form-group">

        <label>Código</label>

        <input
          type="text"
          formControlName="codigo"
          placeholder="Ej. LAP-001">

      </div>

      <div class="form-group">

        <label>Precio</label>

        <input
          type="number"
          formControlName="precio"
          placeholder="0.00">

      </div>

    </div>

    <div class="form-group">

      <label>Nombre</label>

      <input
        type="text"
        formControlName="nombre"
        placeholder="Nombre del producto">

    </div>

    <div class="form-group">

      <label>Descripción</label>

      <textarea
        rows="4"
        formControlName="descripcion"
        placeholder="Descripción del producto">
      </textarea>

    </div>

    <div class="actions">

      <button
        type="button"
        class="btn-secondary"
        (click)="cancelar()">

        Cancelar

      </button>

      <button
        type="button"
        class="btn-primary"
        (click)="save()">

        Guardar producto

      </button>

    </div>

  </form>

</div>
